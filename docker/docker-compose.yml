# Niki — Local Development Infrastructure
# Start with: docker compose -f docker/docker-compose.yml up -d --build
# Stop with:  docker compose -f docker/docker-compose.yml down

services:
  # --- Niki API — FastAPI backend ---
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
    image: niki-backend:latest
    container_name: niki-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      neo4j:
        condition: service_started
    environment:
      # API bind (must be 0.0.0.0 inside the container).
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      LOG_LEVEL: "INFO"
      DEBUG: "false"
      # Internal service hostnames (docker-compose service names).
      REDIS_URL: "redis://redis:6379/0"
      CHROMA_HOST: "chromadb"
      CHROMA_PORT: "8000"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "nikidev123"
      DATABASE_URL: "postgresql+asyncpg://niki:nikidev123@postgres:5432/niki"
      DATABASE_HOST: "postgres"
      DATABASE_PORT: "5432"
      # LLM providers — empty by default; the app falls back to a
      # deterministic stub when keys are blank (see niki/services/llm/).
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DOUBAO_API_KEY: "${DOUBAO_API_KEY:-}"
      # SMS provider — "mock" by default; switch to "aliyun" in prod.
      SMS_PROVIDER: "${SMS_PROVIDER:-mock}"
      SMS_ACCESS_KEY_ID: "${SMS_ACCESS_KEY_ID:-}"
      SMS_ACCESS_KEY_SECRET: "${SMS_ACCESS_KEY_SECRET:-}"
      SMS_SIGN_NAME: "${SMS_SIGN_NAME:-Niki}"
      SMS_TEMPLATE_CODE: "${SMS_TEMPLATE_CODE:-}"
      # Security — override in production via env or secrets manager.
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      ECHO_SMS_CODE_IN_RESPONSE: "${ECHO_SMS_CODE_IN_RESPONSE:-true}"
      RATE_LIMIT_FALLBACK_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      # Source code is baked in for the prod image; mount only for hot-reload dev.
      - ../niki/static:/app/niki/static:ro
    networks:
      - niki-network
  # --- Redis — Short-term memory & session state ---
  redis:
    image: redis:7-alpine
    container_name: niki-redis
    ports:
      - "6379:6379"

      
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - niki-network

  # --- ChromaDB — Vector store ---
  chromadb:
    image: chromadb/chroma:latest
    container_name: niki-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - niki-network

  # --- Neo4j — Cognitive graph ---
  neo4j:
    image: neo4j:5-community
    container_name: niki-neo4j
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/nikidev123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "nikidev123", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - niki-network

  # --- PostgreSQL — Relational data ---
  postgres:
    image: postgres:16-alpine
    container_name: niki-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_USER=niki
      - POSTGRES_PASSWORD=nikidev123
      - POSTGRES_DB=niki
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niki -d niki"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - niki-network

volumes:
  redis_data:
  chroma_data:
  neo4j_data:
  neo4j_logs:
  postgres_data:

networks:
  niki-network:
    driver: bridge
