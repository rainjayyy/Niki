# Alembic configuration - BE-STOR-001.
#
# Run a migration:
#     alembic upgrade head
# Roll back one step:
#     alembic downgrade -1
# Create a new migration:
#     alembic revision -m "<message>"
#
# The connection URL is pulled from Niki's settings (niki.config.settings)
# via `alembic/env.py`, so any change to DATABASE_URL there is honoured
# automatically - no need to edit this file.

[alembic]
# Path to migration scripts.
script_location = alembic

# Template for new migrations.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Search path for `alembic upgrade <rev> --sql` etc.
prepend_sys_path = .

# Timezone for revision timestamps (UTC is safest for CI).
timezone = UTC

# Max identifier length.
truncate_slug_length = 40

# Don't emit the standard logging config (Niki configures structlog itself).
# Leave this commented; env.py handles logging.

# -- Connection --
# Note: sqlalchemy.url is read from niki.config.settings inside env.py.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Auto-format migrations after generation.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

# Apply ruff auto-fixes.
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = check --fix
