[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niki"
version = "0.1.0"
description = "Niki — AI Companion & Growth Assistant for Children aged 3-12"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Niki Team" }
]
keywords = ["children", "ai-companion", "langchain", "education", "emotional-support"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # LangChain ecosystem
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",

    # Configuration
    "pydantic-settings>=2.6.0",

    # Databases & Storage
    "redis[hiredis]>=5.2.0",
    "chromadb>=0.5.0",
    "neo4j>=5.26.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # HTTP & API clients
    "httpx>=0.28.0",
    "tenacity>=9.0.0",

    # Observability
    "structlog>=24.4.0",

    # Security
    "cryptography>=43.0.0",
    "python-jose[cryptography]>=3.3.0",

    # Utilities
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",            # BE-API-002 rate limiting
    "reportlab>=5.0.0",          # BE-DASH-001 PDF weekly report
    "boto3>=1.34.0",             # BE-MEDIA-001-real S3-compatible storage
    "prometheus-client>=0.20.0", # BE-API-009 Prometheus /metrics endpoint
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",               # TestClient for FastAPI
    "aiosqlite>=0.20.0",           # BE-STOR-001: SQLite-async for tests
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["niki*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "neo4j.*",
    "structlog.*",
    "langchain.*",
    "langchain_community.*",
    "langchain_openai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require external services)",
]

[tool.coverage.run]
source = ["niki"]
omit = ["tests/*", "niki/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\bProtocol\b",
]